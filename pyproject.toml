[project]
name = "trading-agents"
version = "0.1.0"
description = "Multi-agent algorithmic trading system with live dashboard"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.20.0",
    "aiolimiter>=1.1.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
